name: CI - Testes Automatizados

on:
  push:
    branches: [main, master]

  workflow_dispatch:

  schedule:
    - cron: '15 22 * * *' # 23:15 Lisboa (UTC ajustado)

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # SISTEMA LOGIN
      # =========================
      - name: Install dependencies (login)
        working-directory: 03-automacao-testes/sistema-login
        run: npm install

      - name: Run tests (login)
        working-directory: 03-automacao-testes/sistema-login
        run: npm test

      # =========================
      # SISTEMA PAGAMENTOS
      # =========================
      - name: Install dependencies (pagamentos)
        working-directory: 03-automacao-testes/sistema-pagamentos
        run: npm install

      - name: Run tests (pagamentos)
        working-directory: 03-automacao-testes/sistema-pagamentos
        run: npm test