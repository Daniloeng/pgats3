name: CI - Testes Automatizados

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: '50 00 * * *'

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================
      # SISTEMA LOGIN
      # =========================

      - name: Instalar dependências - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm ci

      - name: Garantir pasta reports - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: mkdir -p reports

      - name: Testes XML - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npx mocha test --reporter mocha-junit-reporter --reporter-options mochaFile=reports/results.xml

      - name: Testes HTML - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npx mocha test --reporter mochawesome --reporter-options reportDir=mochawesome-report,reportFilename=report,quiet=true

      # =========================
      # SISTEMA PAGAMENTOS
      # =========================

      - name: Instalar dependências - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm ci

      - name: Garantir pasta reports - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: mkdir -p reports

      - name: Testes XML - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npx mocha test --reporter mocha-junit-reporter --reporter-options mochaFile=reports/results.xml

      - name: Testes HTML - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npx mocha test --reporter mochawesome --reporter-options reportDir=mochawesome-report,reportFilename=report,quiet=true

      # =========================
      # UPLOAD DE RELATÓRIOS
      # =========================

      - name: Upload relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ github.run_number }}
          path: |
            03-programacao-para-automacao/sistema-login/reports
            03-programacao-para-automacao/sistema-login/mochawesome-report
            03-programacao-para-automacao/sistema-pagamentos/reports
            03-programacao-para-automacao/sistema-pagamentos/mochawesome-report

  # =========================
  # AUTOMATION EXERCISE - CYPRESS (UI + API)
  # =========================
  testes-cypress:
    name: Cypress - Automation Exercise (UI + API)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: 08-automacao-testes-interface

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instala as dependências (com cache do npm e do binário do Cypress)
      # e executa "npm test" (todos os testes UI + API + relatório Mochawesome)
      - name: Testes Cypress - Automation Exercise
        uses: cypress-io/github-action@v6
        with:
          working-directory: 08-automacao-testes-interface
          command: npm test -- --browser chrome

      - name: Lint - Automation Exercise
        if: always()
        run: npm run lint

      - name: Upload relatório Cypress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress-${{ github.run_number }}
          path: 08-automacao-testes-interface/cypress/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots Cypress
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-cypress-${{ github.run_number }}
          path: 08-automacao-testes-interface/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7