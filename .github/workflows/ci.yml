name: CI - Testes Automatizados

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: '22 23 * * *'

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sistema Login

      - name: Instalar dependências - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm install

      - name: Executar testes - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm test

      # Sistema Pagamentos

      - name: Instalar dependências - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm install

      - name: Executar testes - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm test