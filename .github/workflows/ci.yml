name: CI - Testes Automatizados

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: '30 00 * * *'

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================
      # SISTEMA LOGIN
      # =========================

      - name: Instalar dependências - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm install

      - name: Instalar dependências de reports - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm install --save-dev mocha-junit-reporter mochawesome

      - name: Executar testes XML - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm run test:xml

      - name: Executar testes HTML - Login
        working-directory: 03-programacao-para-automacao/sistema-login
        run: npm run test:html

      # =========================
      # SISTEMA PAGAMENTOS
      # =========================

      - name: Instalar dependências - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm install

      - name: Instalar dependências de reports - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm install --save-dev mocha-junit-reporter mochawesome

      - name: Executar testes XML - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm run test:xml

      - name: Executar testes HTML - Pagamentos
        working-directory: 03-programacao-para-automacao/sistema-pagamentos
        run: npm run test:html

      # =========================
      # UPLOAD DE RELATÓRIOS
      # =========================

      - name: Upload relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ github.run_number }}
          path: |
            03-programacao-para-automacao/sistema-login/reports
            03-programacao-para-automacao/sistema-login/mochawesome-report
            03-programacao-para-automacao/sistema-pagamentos/reports
            03-programacao-para-automacao/sistema-pagamentos/mochawesome-report